        <link rel="stylesheet" href="style.css" />
        <script type="module" src="main.js" defer></script>
    </head>
    <body>
        <header>
            <div class="header_left">
                <div class="header_logo">
                    <a href="#"
                        ><h1 class="logo_title bagel-fat-one-regular">
                            MiLKY MOViE
                        </h1></a
                    >
                </div>
                <div class="header_menu">
                    <ul>
                        <li class="active">
                            <a href="#">홈</a>
                        </li>
                        <li>
                            <a href="#">나의 영화</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="header_right">
                <!-- <form role="search" class="search_box">
                    <input
                        type="search"
                        placeholder="궁금한 영화가 있으신가요?"
                        aria-label="Search"
                    />
                    <button type="submit">
                        <img
                            src="https://cdn-icons-png.flaticon.com/512/622/622669.png"
                            alt="search"
                            width="20"
                            height="20"
                            class="search_icon"
                        />

                <div class="auth_box">
                    <a href="#">로그인/가입</a>
                    <!-- <a href="#">회원가입</a> -->
                </div>
            </div>
        </header>
        <main>
            <div class="search_box_container">
                <form role="search" class="search_box">
                    <input
                        type="search"
                        placeholder="궁금한 영화가 있으신가요?"
                        aria-label="Search"
                    />
                    <button type="submit">
                        <img
                            src="https://cdn-icons-png.flaticon.com/512/622/622669.png"
                            alt="search"
                            width="20"
                            height="20"
                            class="search_icon"
                        />
                    </button>
                </form>
                <div class="search-result"></div>
            </div>
            <h1 class="trends-movie-title">
                인기 영화 -
                <span class="bagel-fat-one-regular" style="font-size: 2rem"
                    >DAiLY</span
                >
            </h1>
            <!-- 인기영화 top5 - 슬라이드 -->
            <div class="trends-movie" id="slide-box">
                <button id="prevBtn">이전</button>
                <div class="slide-container" id="slides"></div>
                <button id="nextBtn">다음</button>
            </div>
        </main>
